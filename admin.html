<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Administrar - Página de Amor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos específicos del admin */
        .admin-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .admin-header {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            padding: 25px 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .admin-header h1 {
            font-size: 1.8rem;
            color: #e91e63;
        }

        .admin-header .btn-logout {
            background: #e91e63;
            color: #fff;
            border: none;
            padding: 10px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .admin-header .btn-logout:hover {
            background: #c2185b;
            transform: scale(1.05);
        }

        /* Login */
        .login-box {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 30px;
            max-width: 400px;
            margin: 100px auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            text-align: center;
        }

        .login-box h2 {
            color: #e91e63;
            margin-bottom: 20px;
        }

        .login-box input {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid #ddd;
            border-radius: 30px;
            font-size: 1rem;
            margin-bottom: 15px;
            transition: border-color 0.3s ease;
        }

        .login-box input:focus {
            outline: none;
            border-color: #e91e63;
        }

        .login-box .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e91e63, #9c27b0);
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-box .btn-login:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(233, 30, 99, 0.4);
        }

        .login-error {
            color: #e91e63;
            margin-top: 10px;
            display: none;
        }

        /* Formulario de subida */
        .upload-section {
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .upload-section h2 {
            color: #4a148c;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        .upload-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .upload-form .full-width {
            grid-column: 1 / -1;
        }

        .upload-form label {
            font-weight: 600;
            color: #555;
            display: block;
            margin-bottom: 5px;
        }

        .upload-form input[type="file"],
        .upload-form input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: border-color 0.3s ease;
            background: #fafafa;
        }

        .upload-form input:focus {
            outline: none;
            border-color: #e91e63;
        }

        .upload-form .btn-subir {
            padding: 14px 30px;
            background: linear-gradient(135deg, #e91e63, #9c27b0);
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .upload-form .btn-subir:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(233, 30, 99, 0.3);
        }

        /* Lista de contenido */
        .content-list {
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .content-list h2 {
            color: #4a148c;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .content-item {
            background: #f8f9fa;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            position: relative;
        }

        .content-item:hover {
            border-color: #e91e63;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .content-item .preview {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background: #ddd;
        }

        .content-item .preview-video {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background: #1a1a2e;
        }

        .content-item .info {
            padding: 12px 15px;
        }

        .content-item .info .frase-preview {
            font-size: 0.85rem;
            color: #555;
            font-style: italic;
            margin-top: 5px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .content-item .tipo-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .content-item .btn-eliminar {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #e91e63;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            opacity: 0;
        }

        .content-item:hover .btn-eliminar {
            opacity: 1;
        }

        .content-item .btn-eliminar:hover {
            transform: scale(1.1);
            background: #c2185b;
        }

        /* Mensajes */
        .mensaje {
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: none;
        }

        .mensaje.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }

        .mensaje.error {
            display: block;
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }

        /* Responsive admin */
        @media (max-width: 768px) {
            .upload-form {
                grid-template-columns: 1fr;
            }

            .admin-header {
                flex-direction: column;
                text-align: center;
            }

            .content-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }

        /* Ocultar secciones */
        .admin-content {
            display: none;
        }
    </style>
</head>
<body>
    <div class="floating-hearts" id="floatingHearts"></div>

    <div class="admin-container">
        <!-- LOGIN -->
        <div id="loginSection" class="login-box">
            <h2>🔐 Administrar</h2>
            <p style="color: #777; margin-bottom: 20px;">Ingresa la contraseña para gestionar el contenido</p>
            <input type="password" id="passwordInput" placeholder="Contraseña..." onkeydown="if(event.key==='Enter') login()">
            <button class="btn-login" onclick="login()"><i class="fas fa-unlock"></i> Acceder</button>
            <p class="login-error" id="loginError">❌ Contraseña incorrecta. Intenta de nuevo.</p>
        </div>

        <!-- ADMIN CONTENT -->
        <div id="adminContent" class="admin-content">
            <div class="admin-header">
                <h1><i class="fas fa-heart" style="color:#e91e63;"></i> Panel de Administración</h1>
                <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</button>
            </div>

            <!-- Mensajes -->
            <div id="mensaje" class="mensaje"></div>

            <!-- Subir contenido -->
            <div class="upload-section">
                <h2><i class="fas fa-upload"></i> Subir nuevo contenido</h2>
                <form id="uploadForm" class="upload-form" onsubmit="subirContenido(event)">
                    <div>
                        <label><i class="fas fa-image"></i> Imagen o Video</label>
                        <input type="file" id="archivoInput" accept="image/*,video/*" required>
                    </div>
                    <div>
                        <label><i class="fas fa-tag"></i> Tipo</label>
                        <input type="text" id="tipoInput" value="imagen" readonly style="background:#f0f0f0;">
                    </div>
                    <div class="full-width">
                        <label><i class="fas fa-quote-left"></i> Frase romántica</label>
                        <input type="text" id="fraseInput" placeholder="Escribe una frase especial..." required>
                    </div>
                    <div class="full-width">
                        <button type="submit" class="btn-subir"><i class="fas fa-cloud-upload-alt"></i> Subir contenido</button>
                    </div>
                </form>
            </div>

            <!-- Lista de contenido -->
            <div class="content-list">
                <h2><i class="fas fa-list"></i> Contenido actual</h2>
                <div id="contentGrid" class="content-grid">
                    <!-- Se carga desde JavaScript -->
                </div>
                <p style="text-align: center; color: #999; margin-top: 20px;" id="emptyMessage">No hay contenido aún. ¡Sube tu primera foto o video!</p>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
